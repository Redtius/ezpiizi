[project]
name = "ezpiizi"
version = "0.1.0"
description = "Reversible PII pseudonymisation for French / Moroccan LLM assistants: Presidio, or Presidio + PII-Tracer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Reda Mountassir", email = "redtius@gmail.com" }]
requires-python = ">=3.12"
keywords = ["pii", "pseudonymization", "anonymization", "privacy", "gdpr", "presidio", "llm", "langchain",
            "french", "morocco", "banking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: French",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
]

[project.optional-dependencies]
tracer = ["torch>=2.4", "transformers>=5.2"]       # PII-Tracer (remote code, pinned revision)
langchain = ["langchain>=1.4"]                      # PseudonymisationMiddleware
bench = ["huggingface_hub", "pyarrow"]              # MAPA / Gretel datasets
dev = ["pytest", "ruff", "build", "twine"]

[project.urls]
Homepage = "https://github.com/redtius/ezpiizi"
Documentation = "https://github.com/redtius/ezpiizi/tree/main/docs"
Repository = "https://github.com/redtius/ezpiizi"
Issues = "https://github.com/redtius/ezpiizi/issues"
Changelog = "https://github.com/redtius/ezpiizi/blob/main/CHANGELOG.md"

[project.scripts]
ezpiizi = "ezpiizi.cli:main"
ezpiizi-bench = "ezpiizi.bench.run:main"

[build-system]
requires = ["setuptools>=77"]                       # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]   # explicit: CI must not depend on a local ruff config
ignore = ["E501"]                    # long lines: tables and regexes read better unwrapped
